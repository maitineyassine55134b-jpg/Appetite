<style>
:root{--r:14px;--bg:#fff;--c:#f4f4f4;--t:#111;--m:#666;--l:#e3e3e3;--o:#FF5A1F}
[data-theme=dark]{--bg:#0f0f0f;--c:#1c1c1c;--t:#f2f2f2;--m:#9a9a9a;--l:#2c2c2c}
*{box-sizing:border-box}
body{margin:0;font-family:var(--fb,system-ui,sans-serif);background:var(--bg);color:var(--t);font-size:15px;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--l);position:sticky;top:0;background:var(--bg);z-index:5}
header b{color:var(--o);font-size:18px;flex:1}
main{max-width:640px;margin:auto;padding:14px 14px 96px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:640px;margin:auto;display:flex;background:var(--bg);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 12px;background:var(--o);color:#fff}
button.g{background:var(--c);color:var(--t);border:1px solid var(--l)}
button.s{padding:6px 10px;font-size:13px}
nav button{flex:1;background:none;color:var(--m);border-radius:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--o);font-weight:600}
input,select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--l);background:var(--c);color:var(--t);margin:4px 0}
.card{background:var(--c);border:1px solid var(--l);border-radius:var(--r);padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;border:1px solid var(--l);margin:2px;background:var(--c);color:var(--t);font-size:13px;cursor:pointer}
.chip.on{background:var(--o);color:#fff;border-color:var(--o)}
.m{color:var(--m);font-size:13px}
h2{margin:8px 0 4px;font-size:18px;font-family:var(--ft,Georgia,serif)}
header b{font-family:var(--ft,Georgia,serif)}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--l)}
.ok{color:#1a9d4a}.warn{color:var(--o)}
.center{text-align:center}
.bar{background:var(--l);border-radius:99px;height:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--o)}
svg.map{width:100%;height:auto;border-radius:14px;border:1px solid var(--l);display:block}
.ic{display:inline-block}
.reels{display:flex;gap:10px;justify-content:center;background:#1a1a1a;padding:14px;border-radius:18px;box-shadow:inset 0 4px 16px #000a}
.reel{width:96px;height:96px;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.reel-s{width:72px;height:72px}
.reel-s svg{width:100%;height:100%}
.ic svg{width:100%;height:100%;display:block}
</style>

function done(f){

 if(!me){spinning=false;return;}
 const cnt={};f.forEach(k=>cnt[k]=(cnt[k]||0)+1);
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
 let pts=0,win=null,msg=t('lose');
 if(top[1]===3){win=f[0];pts=RV[win]*10;msg=t('jack');}
 else if(top[1]===2){win=top[0];pts=RV[win]*2;msg=t('pair');}
 S.reel=f;
 if(win)S.ings=(S.ings||[]).concat(win);
 if(pts){me.score=(me.score||0)+pts;me.best=Math.max(me.best||0,me.score);}
 S.rmsg=pts?`+${pts} ${t('gained')}`:msg;
 spinning=false;sv();R();
}

function KSPAWN(){

function KTICK(){

 if(gone){KG.score=Math.max(0,KG.score-10*gone);KG.msg=t('kleft');}
